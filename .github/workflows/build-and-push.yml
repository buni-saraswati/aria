name: Build and Push to ACR

on:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'config.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: acrdocintdev001.azurecr.io
  IMAGE_NAME: aria

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: aria
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name acrdocintdev001

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push to ACR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Container App (optional)
        if: github.ref == 'refs/heads/dev'
        run: |
          az containerapp update \
            --name ca-aria-dev \
            --resource-group rg-docint-dev \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Echo deployment status
        run: |
          echo "✅ Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "✅ Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Cleanup - Remove local Docker images
        if: always()
        run: |
          docker rmi -f ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
          docker rmi -f ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} || true
          echo "✅ Local Docker images cleaned up"

      - name: Cleanup - Logout from ACR
        if: always()
        run: |
          az acr logout --name acrdocintdev001 || true
          echo "✅ Logged out from ACR"

      - name: Cleanup - Azure logout
        if: always()
        run: |
          az logout || true
          echo "✅ Azure CLI logged out"
